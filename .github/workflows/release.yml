# Signed installers for every pushed commit. Missing credentials fail closed.
#
# A push to `main` becomes a production release and is marked Latest. A push
# to any other branch becomes a prerelease. Releases need tags even when the
# project is not cutting a semantic version, so each workflow run gets an
# automatic, unique tag tied to its commit.

name: Release

on:
  push:
    branches: ["**"]
  # A manual run proves the packaging path and uploads workflow artifacts,
  # but does not publish a duplicate release for the selected commit.
  workflow_dispatch:

# Do not add branch-scoped concurrency here. GitHub retains at most one pending
# run in a concurrency group, so quick successive pushes could otherwise skip
# releases for commits in the middle.

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # arm64 *and* x64, because an Intel Mac cannot run an arm64 build
            # and the download page has no way to explain that to someone who
            # picked the wrong one.
            builder: --mac --arm64 --x64
            artifact: macos
          - os: windows-latest
            builder: --win --x64
            artifact: windows

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Keep the release gate identical to CI. Build has to be first because
      # workspace exports resolve through dist/, which npm ci does not create.
      - name: Assign an increasing application version
        run: node scripts/release-version.mjs

      - name: Build
        env:
          CUESHEET_SIGNED_RELEASE: "true"
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Package
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: npx electron-builder --config electron-builder.release.mjs ${{ matrix.builder }} --publish never

      - name: Verify macOS signatures and notarization tickets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in packages/desktop/release/mac*/Cuesheet.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

      - name: Verify Windows installer and application signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem packages/desktop/release/*.exe)
          $files += Get-Item packages/desktop/release/win-unpacked/Cuesheet.exe
          if ($files.Count -lt 2) { throw "Missing installer or application" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($file.Name)" }
          }

      - name: Require update manifests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -s packages/desktop/release/latest-mac.yml
          else
            test -s packages/desktop/release/latest.yml
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.artifact }}
          # Manifests and blockmaps are part of the release, not build debris.
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ github.ref_name }} release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` creates both the automatic tag and its release.
      contents: write

    steps:
      # Read the changelog from the exact commit whose installers were built.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare release notes from the changelog
        run: node scripts/release-notes.mjs release-notes.md

      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: There are installers to attach
        run: |
          ls -la installers
          test -n "$(ls -A installers)" || {
            echo "::error::No installers were downloaded."
            exit 1
          }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          tag="build-${GITHUB_RUN_ID}-${short_sha}"

          if [ "$BRANCH_NAME" = "main" ]; then
            channel="Production"
            release_flags=(--latest)
          else
            channel="Prerelease"
            release_flags=(--prerelease --latest=false)
          fi

          gh release create "$tag" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cuesheet ${channel} — ${BRANCH_NAME} (${short_sha})" \
            --draft \
            --notes-file release-notes.md \
            "${release_flags[@]}"

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${release_flags[@]}"
