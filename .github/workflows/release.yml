# Installers for every pushed commit.
#
# A push to `main` becomes a production release and is marked Latest. A push
# to any other branch becomes a prerelease. Releases need tags even when the
# project is not cutting a semantic version, so each workflow run gets an
# automatic, unique tag tied to its commit.

name: Release

on:
  push:
    branches: ["**"]
  # A manual run proves the packaging path and uploads workflow artifacts,
  # but does not publish a duplicate release for the selected commit.
  workflow_dispatch:

# Do not add branch-scoped concurrency here. GitHub retains at most one pending
# run in a concurrency group, so quick successive pushes could otherwise skip
# releases for commits in the middle.

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # arm64 *and* x64, because an Intel Mac cannot run an arm64 build
            # and the download page has no way to explain that to someone who
            # picked the wrong one.
            builder: --mac --arm64 --x64
            artifact: macos
          - os: windows-latest
            builder: --win --x64
            artifact: windows

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Keep the release gate identical to CI. Build has to be first because
      # workspace exports resolve through dist/, which npm ci does not create.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Package
        working-directory: packages/desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.artifact }}
          # The installers themselves. `.blockmap` and `latest*.yml` belong to
          # an auto-updater this app does not have yet.
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ github.ref_name }} release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` creates both the automatic tag and its release.
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: There are installers to attach
        run: |
          ls -la installers
          test -n "$(ls -A installers)" || {
            echo "::error::No installers were downloaded."
            exit 1
          }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          tag="build-${GITHUB_RUN_ID}-${short_sha}"
          example_installer="$(basename "$(find installers -maxdepth 1 -type f | head -n 1)")"

          if [ "$BRANCH_NAME" = "main" ]; then
            channel="Production"
            release_flags=(--latest)
          else
            channel="Prerelease"
            release_flags=(--prerelease --latest=false)
          fi

          cat > release-notes.md <<NOTES
          Automated **${channel}** build from branch \`${BRANCH_NAME}\` at commit [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          The packaged application version is shown in each download's filename (for example, \`${example_installer}\`).

          ### Installing

          - **macOS** — the app is not signed or notarized, so Gatekeeper may block it. Right-click the app and choose *Open*, or run \`xattr -d com.apple.quarantine /Applications/Cuesheet.app\`.
          - **Windows** — the installer is not signed, so SmartScreen may warn. Choose *More info* → *Run anyway*.
          NOTES

          gh release create "$tag" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cuesheet ${channel} — ${BRANCH_NAME} (${short_sha})" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
